<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>YouTube 知识库</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="orbs" aria-hidden="true">
      <span class="orb orb-mint"></span>
      <span class="orb orb-peach"></span>
      <span class="orb orb-lemon"></span>
    </div>

    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="24" height="24" fill="none">
              <path d="M16 27c5.5 0 10-4.2 10-9.6 0-6.1-5.2-9.2-10-12.4C11.2 8.2 6 11.3 6 17.4 6 22.8 10.5 27 16 27Z" fill="#ffffff" fill-opacity=".92"/>
              <path d="M13.2 14.4v6.2l5.3-3.1-5.3-3.1Z" fill="#4c9c82"/>
            </svg>
          </div>
          <div class="brand-copy">
            <h1>YouTube 知识库</h1>
            <p>播放即归档 · Brave</p>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat-num" id="stat-videos">—</span>
            <span class="stat-label">篇笔记</span>
          </div>
          <div class="stat">
            <span class="stat-num" id="stat-time">—</span>
            <span class="stat-label">累计观看</span>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="section-label">分类</div>
          <nav class="cats" id="categories" aria-label="分类筛选"></nav>
        </div>

        <div class="sidebar-foot">
          <span class="status-dot" id="status-dot"></span>
          <span class="sync-label" id="sync-label">连接中…</span>
          <button class="icon-btn" id="refresh" type="button" title="刷新" aria-label="刷新">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 10a6 6 0 1 1-1.8-4.3" />
              <path d="M16 4v4h-4" />
            </svg>
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <label class="search">
            <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <circle cx="9" cy="9" r="5.4" />
              <path d="m13.2 13.2 3.4 3.4" />
            </svg>
            <input id="search" type="search" placeholder="搜索标题、频道、标签、一句话总结…" autocomplete="off" />
            <kbd>/</kbd>
          </label>
          <div class="sort-wrap">
            <label for="sort">排序</label>
            <select id="sort">
              <option value="recent">最近观看</option>
              <option value="watched">观看最多</option>
              <option value="title">标题</option>
            </select>
          </div>
        </header>

        <div class="content-head">
          <div>
            <h2 id="list-title">全部笔记</h2>
            <p id="list-sub">正在读取归档…</p>
          </div>
          <span class="count-pill" id="count-pill">0</span>
        </div>

        <section class="grid" id="grid" aria-live="polite"></section>

        <div class="loading" id="loading" hidden>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>

        <div class="empty" id="empty" hidden>
          <svg viewBox="0 0 180 130" width="180" height="130" fill="none" aria-hidden="true">
            <rect x="24" y="26" width="96" height="82" rx="14" fill="#e9f6f0" stroke="#cfe8dc" stroke-width="2"/>
            <rect x="40" y="44" width="52" height="6" rx="3" fill="#b9ddcd"/>
            <rect x="40" y="58" width="64" height="6" rx="3" fill="#d8ece2"/>
            <rect x="40" y="72" width="44" height="6" rx="3" fill="#d8ece2"/>
            <circle cx="130" cy="78" r="26" fill="#fbe3d6"/>
            <path d="M124 68v20l17-10-17-10Z" fill="#ef9f7c"/>
            <path d="M116 34c7-7 18-4 18 5 0 6-6 9-12 12" stroke="#8cc7ae" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="152" cy="30" r="4" fill="#f2d98c"/>
          </svg>
          <h3>还没有归档的笔记</h3>
          <p>在 Brave 里播放任意 YouTube 视频 ≥ 45 秒，笔记会自动出现在这里。</p>
          <button class="btn primary" id="retry" type="button">重新加载</button>
        </div>
      </main>
    </div>

    <div class="drawer" id="drawer" hidden>
      <div class="drawer-backdrop" data-close></div>
      <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <header class="drawer-head">
          <span class="drawer-cat" id="drawer-cat">分类</span>
          <button class="icon-btn" id="close-drawer" type="button" aria-label="关闭">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="m5 5 10 10M15 5 5 15" />
            </svg>
          </button>
        </header>
        <div class="drawer-scroll">
          <h2 id="drawer-title">笔记</h2>
          <p class="drawer-summary" id="drawer-summary"></p>
          <div class="drawer-meta" id="drawer-meta"></div>
          <div class="note-banner" id="note-banner" hidden></div>
          <div class="feature-chips" id="feature-chips"></div>
          <div class="drawer-actions">
            <a class="btn primary" id="open-youtube" href="#" target="_blank" rel="noreferrer">打开 YouTube</a>
            <button class="btn ghost" id="reveal" type="button">在 Finder 显示</button>
            <button class="btn ghost" id="copy-path" type="button">复制路径</button>
          </div>

          <div class="drawer-tabs" id="drawer-tabs" role="tablist" aria-label="笔记视图">
            <button class="drawer-tab active" type="button" data-tab="summary" role="tab" aria-selected="true">总结</button>
            <button class="drawer-tab" type="button" data-tab="paragraphs" role="tab" aria-selected="false">
              段落 <span class="tab-count" id="count-paragraphs"></span>
            </button>
            <button class="drawer-tab" type="button" data-tab="expressions" role="tab" aria-selected="false">
              英文表达 <span class="tab-count" id="count-expressions"></span>
            </button>
            <button class="drawer-tab" type="button" data-tab="transcript" role="tab" aria-selected="false">
              字幕 <span class="tab-count" id="count-sentences"></span>
            </button>
          </div>

          <section class="tab-panel active" id="panel-summary" role="tabpanel">
            <div class="summary-cta" id="summary-cta" hidden>
              <h3 id="summary-cta-title">还没有生成总结</h3>
              <p id="summary-cta-text">字幕和译文已经保存。生成总结会调用一次模型，产出核心要点、段落笔记和常用英文表达。</p>
              <button class="btn primary" id="generate-summary" type="button">生成总结</button>
            </div>
            <article class="markdown" id="markdown"></article>
          </section>

          <section class="tab-panel" id="panel-paragraphs" role="tabpanel" hidden>
            <div class="paragraph-list" id="paragraphs"></div>
          </section>

          <section class="tab-panel" id="panel-expressions" role="tabpanel" hidden>
            <div class="panel-tools">
              <label class="search compact">
                <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                  <circle cx="9" cy="9" r="5.4" />
                  <path d="m13.2 13.2 3.4 3.4" />
                </svg>
                <input id="expression-search" type="search" placeholder="搜索表达或中文释义…" autocomplete="off" />
              </label>
              <span class="panel-hint" id="expression-hint"></span>
            </div>
            <div class="expression-list" id="expressions"></div>
          </section>

          <section class="tab-panel" id="panel-transcript" role="tabpanel" hidden>
            <div class="panel-tools">
              <div class="segmented" id="transcript-mode" role="group" aria-label="字幕显示模式">
                <button type="button" data-mode="bilingual" class="active">对照</button>
                <button type="button" data-mode="source">原文</button>
                <button type="button" data-mode="translation">译文</button>
              </div>
              <label class="search compact">
                <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                  <circle cx="9" cy="9" r="5.4" />
                  <path d="m13.2 13.2 3.4 3.4" />
                </svg>
                <input id="transcript-search" type="search" placeholder="搜索字幕…" autocomplete="off" />
              </label>
            </div>
            <div class="translate-cta" id="translate-cta" hidden>
              <span id="translate-cta-text">还没有生成中文译文。</span>
              <button class="mini-btn" id="generate-translation" type="button">翻译字幕</button>
            </div>
            <div class="transcript-list" id="transcript"></div>
          </section>
        </div>
      </aside>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <noscript>需要启用 JavaScript 才能浏览知识库。</noscript>

    <script src="/app.js"></script>
  </body>
</html>
